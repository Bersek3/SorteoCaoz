<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget de Alertas Kick - OBS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .alert-box {
      background: linear-gradient(135deg, rgba(14, 20, 32, 0.95), rgba(8, 12, 20, 0.98));
      border: 2px solid var(--kick-green);
      border-radius: 24px;
      padding: 20px 30px;
      box-shadow: 0 0 40px var(--kick-green-glow), 0 20px 60px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      gap: 20px;
      transform: translateY(100px) scale(0.8);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 550px;
    }

    .alert-box.show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .alert-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid var(--kick-green);
      box-shadow: 0 0 20px var(--kick-green-glow);
    }

    .alert-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .alert-user {
      color: var(--kick-green);
      font-weight: 900;
    }

    .alert-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .alert-badge {
      background: rgba(83, 252, 24, 0.15);
      color: var(--kick-green);
      border: 1px solid var(--kick-green);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="alert-box" id="alertBox">
    <img src="" alt="User Avatar" class="alert-avatar" id="alertAvatar">
    <div style="flex: 1;">
      <div class="alert-title">
        <span class="alert-user" id="alertUsername">@Usuario</span>
      </div>
      <div class="alert-desc" id="alertLabel">¡Se ha suscrito al canal de Kick!</div>
    </div>
    <div class="alert-badge" id="alertBadge">+1 TICKET</div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/config.js"></script>
  <script>
    const alertBox = document.getElementById('alertBox');
    const alertAvatar = document.getElementById('alertAvatar');
    const alertUsername = document.getElementById('alertUsername');
    const alertLabel = document.getElementById('alertLabel');
    const alertBadge = document.getElementById('alertBadge');

    function triggerAlert(username, avatar, label, tickets) {
      alertAvatar.src = avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${username}`;
      alertUsername.textContent = `@${username}`;
      alertLabel.textContent = label;
      alertBadge.textContent = `+${tickets} TICKET${tickets > 1 ? 'S' : ''}`;

      alertBox.classList.add('show');
      window.soundFX.playSuccessChime();

      if (typeof confetti === 'function') {
        confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
      }

      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 5000);
    }

    function initRealtime() {
      if (!supabaseClient) return;
      supabaseClient
        .channel('widget_alert_realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kick_events' }, (payload) => {
          const ev = payload.new;
          if (ev) {
            const count = ev.count || 1;
            const label = count > 1 ? `¡Regaló ${count} suscripciones en Kick!` : '¡Se ha suscrito en Kick!';
            triggerAlert(ev.username, null, label, count);
          }
        })
        .subscribe();
    }

    initRealtime();
  </script>
</body>
</html>
