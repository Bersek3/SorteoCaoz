<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget de Alertas Kick - OBS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .alert-box {
      background: linear-gradient(135deg, rgba(14, 20, 32, 0.95), rgba(8, 12, 20, 0.98));
      border: 2px solid var(--kick-green);
      border-radius: 24px;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 0 35px var(--kick-green-glow), 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: translateY(-100px) scale(0.8);
      opacity: 0;
      visibility: hidden;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 550px;
      width: 100%;
    }

    .alert-box.active {
      transform: translateY(0) scale(1);
      opacity: 1;
      visibility: visible;
    }

    .alert-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid var(--kick-green);
      background: #141c2b;
      box-shadow: 0 0 20px var(--kick-green-glow);
    }

    .alert-content {
      display: flex;
      flex-direction: column;
    }

    .alert-tag {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--kick-green);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .alert-username {
      font-size: 1.6rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .alert-message {
      font-size: 1.05rem;
      color: var(--cyan-accent);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="alert-box" id="alertBox">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=KickUser" alt="Avatar" class="alert-avatar" id="alertAvatar">
    <div class="alert-content">
      <div class="alert-tag" id="alertTag">⭐ NUEVA SUSCRIPCIÓN EN KICK</div>
      <div class="alert-username" id="alertUser">@GamerPro99</div>
      <div class="alert-message" id="alertMessage">+5 Tickets añadidos al Sorteo PS5 🎟️</div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script>
    const alertBox = document.getElementById('alertBox');
    const alertAvatar = document.getElementById('alertAvatar');
    const alertTag = document.getElementById('alertTag');
    const alertUser = document.getElementById('alertUser');
    const alertMessage = document.getElementById('alertMessage');

    let alertQueue = [];
    let isShowing = false;

    function showAlert(evt) {
      alertQueue.push(evt);
      if (!isShowing) processQueue();
    }

    function processQueue() {
      if (alertQueue.length === 0) {
        isShowing = false;
        return;
      }

      isShowing = true;
      const evt = alertQueue.shift();

      alertAvatar.src = evt.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${evt.username}`;
      alertUser.textContent = `@${evt.username}`;
      alertMessage.textContent = `+${evt.tickets_added} Tickets añadidos al Sorteo PS5 🎟️`;
      alertTag.textContent = evt.tickets_added > 1 ? `🎁 REGALÓ ${evt.tickets_added} SUBS EN KICK` : '⭐ NUEVA SUSCRIPCIÓN EN KICK';

      alertBox.classList.add('active');
      window.soundFX.playSuccessChime();

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.6 }
        });
      }

      setTimeout(() => {
        alertBox.classList.remove('active');
        setTimeout(processQueue, 600);
      }, 5000);
    }

    // WebSocket Listener
    function initWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws`);
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'KICK_EVENT') {
            showAlert(msg.event);
          }
        } catch (err) {}
      };
      ws.onclose = () => setTimeout(initWS, 3000);
    }

    initWS();
  </script>
</body>
</html>
