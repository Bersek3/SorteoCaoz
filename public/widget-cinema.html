<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Mini Sala de Cine - OBS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-cinema-card {
      background: rgba(14, 20, 32, 0.92);
      backdrop-filter: blur(14px);
      border: 2px solid var(--kick-green);
      box-shadow: 0 0 30px rgba(83, 252, 24, 0.25), 0 15px 40px rgba(0, 0, 0, 0.8);
      border-radius: 20px;
      padding: 18px;
      width: 360px;
    }

    .mini-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .mini-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-badge {
      background: rgba(83, 252, 24, 0.15);
      border: 1px solid var(--kick-green);
      color: var(--kick-green);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
    }

    .mini-screen {
      height: 12px;
      background: linear-gradient(180deg, var(--kick-green) 0%, transparent 100%);
      border-radius: 50% / 100% 100% 0 0;
      margin-bottom: 14px;
      opacity: 0.8;
      box-shadow: 0 0 12px rgba(83, 252, 24, 0.6);
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }

    .mini-seat {
      aspect-ratio: 1;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .mini-seat.taken {
      background: var(--kick-pink);
      border-color: #ff3366;
      color: #ffffff;
      box-shadow: 0 0 6px rgba(255, 51, 102, 0.6);
      animation: mini-pulse 0.4s ease-out;
    }

    @keyframes mini-pulse {
      0% { transform: scale(1); background: var(--kick-green); }
      50% { transform: scale(1.3); background: #ffffff; box-shadow: 0 0 12px #fff; }
      100% { transform: scale(1); background: #ff3366; }
    }

    .mini-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="mini-cinema-card">
    <div class="mini-header">
      <div class="mini-title">
        <span>🎮</span> SALA SORTEO PS5
      </div>
      <div class="mini-badge" id="occupancyText">0 / 200</div>
    </div>

    <div class="mini-screen"></div>

    <div class="mini-grid" id="miniGrid">
      <!-- Mini asientos generados con JS -->
    </div>

    <div class="mini-footer">
      <span>1 Sub = 1 Asiento</span>
      <span style="color: var(--kick-green);" id="percentText">0% Lleno</span>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const miniGrid = document.getElementById('miniGrid');
    const occupancyText = document.getElementById('occupancyText');
    const percentText = document.getElementById('percentText');

    async function loadData() {
      if (!supabase) return;
      try {
        const [configRes, seatsRes] = await Promise.all([
          supabase.from('giveaway_config').select('*').eq('id', 'current').single(),
          supabase.from('seats').select('*')
        ]);

        const total = configRes.data?.total_seats || 100;
        const seatsList = seatsRes.data || [];
        const seatsMap = {};
        seatsList.forEach(s => { seatsMap[String(s.seat_number)] = true; });

        renderMiniSeats(total, seatsMap, seatsList.length);
      } catch (e) {}
    }

    function renderMiniSeats(total, seatsMap, occupiedCount) {
      miniGrid.innerHTML = '';
      occupancyText.textContent = `${occupiedCount} / ${total}`;
      percentText.textContent = `${Math.round((occupiedCount / total) * 100)}% Lleno`;

      const displayMax = Math.min(total, 100);
      for (let i = 1; i <= displayMax; i++) {
        const isOccupied = String(i) in seatsMap;
        const seat = document.createElement('div');
        seat.className = `mini-seat ${isOccupied ? 'taken' : ''}`;
        seat.textContent = i;
        miniGrid.appendChild(seat);
      }
    }

    function initRealtime() {
      if (!supabase) return;
      supabase
        .channel('widget_cinema_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'seats' }, () => loadData())
        .subscribe();
    }

    loadData();
    initRealtime();
  </script>
</body>
</html>
