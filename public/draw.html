<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo en Vivo PS5 Kick - OBS Overlay</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: #06090e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    .draw-arena {
      width: 100%;
      max-width: 900px;
      text-align: center;
      position: relative;
    }

    .draw-title {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, var(--kick-green) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .draw-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    /* Cinematic Number Tumbler Box */
    .tumbler-container {
      background: linear-gradient(180deg, #101624 0%, #0a0d16 100%);
      border: 2px solid var(--border-glow);
      border-radius: 28px;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(83, 252, 24, 0.15);
      margin-bottom: 30px;
    }

    .tumbler-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--kick-green), var(--cyan-accent), var(--kick-green));
    }

    .rolling-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }

    .rolling-number {
      font-size: 7.5rem;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--kick-green);
      text-shadow: 0 0 35px var(--kick-green-glow);
      line-height: 1;
      letter-spacing: -2px;
      transition: transform 0.05s ease;
    }

    .rolling-user-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid var(--border-color);
    }

    .rolling-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--kick-green);
    }

    .rolling-username {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    /* Winner Revealed Card */
    .winner-card {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(83, 252, 24, 0.12));
      border: 2px solid #ffd700;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
      display: none;
      animation: pop-winner 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pop-winner {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .winner-badge-top {
      background: #ffd700;
      color: #000;
      font-weight: 900;
      font-size: 0.9rem;
      padding: 4px 16px;
      border-radius: 20px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .winner-avatar-big {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #ffd700;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
      margin-bottom: 12px;
    }

    .winner-name-text {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .winner-seat-number {
      font-size: 1.6rem;
      font-family: var(--font-mono);
      font-weight: 800;
      color: var(--kick-green);
      margin-bottom: 16px;
    }

    .stats-pill-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .obs-controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="draw-arena">
    <div class="draw-title" id="drawPrizeTitle">GRAN SORTEO PLAYSTATION 5</div>
    <div class="draw-subtitle" id="drawSubtitle">Ruleta Oficial del Canal en Vivo</div>

    <!-- Active Tumbler Box -->
    <div class="tumbler-container" id="tumblerBox">
      <div class="rolling-display">
        <div class="rolling-number" id="rollingNumberDisplay">#--</div>
        <div class="rolling-user-preview" id="rollingUserBox" style="visibility: hidden;">
          <img src="" alt="Avatar" class="rolling-avatar" id="rollingAvatar">
          <span class="rolling-username" id="rollingUsername">@User</span>
        </div>
      </div>
    </div>

    <!-- Winner Reveal Card -->
    <div class="winner-card" id="winnerCard">
      <div class="winner-badge-top">🏆 ¡GANADOR OFICIAL DEL PS5! 🏆</div>
      <div>
        <img src="" alt="Winner" class="winner-avatar-big" id="winnerAvatar">
      </div>
      <div class="winner-name-text" id="winnerName">@KickWinner</div>
      <div class="winner-seat-number">
        Asiento Ganador: <strong id="winnerSeatNum">#77</strong>
      </div>
      
      <div class="stats-pill-row">
        <div class="rule-pill">
          <span>🎟️</span> Tickets Totales: <strong id="winnerTotalTickets">0</strong>
        </div>
        <div class="rule-pill">
          <span>📊</span> Probabilidad: <strong id="winnerOdds">0%</strong>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="obs-controls">
      <button class="btn btn-primary" style="font-size: 1.1rem; padding: 14px 32px;" id="startDrawBtn">
        🎰 INICIAR SORTEO EN VIVO
      </button>
      <button class="btn btn-secondary" style="padding: 14px 20px;" id="resetDrawViewBtn">
        🔄 Nuevo Giro
      </button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/audio.js"></script>
  <script src="js/config.js"></script>
  <script src="js/draw.js"></script>
</body>
</html>
