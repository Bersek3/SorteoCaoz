<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Barra de Progreso Sorteo PS5 - OBS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .goal-bar-card {
      background: rgba(14, 20, 32, 0.95);
      border: 2px solid var(--kick-green);
      box-shadow: 0 0 30px rgba(83, 252, 24, 0.3), 0 15px 35px rgba(0, 0, 0, 0.8);
      border-radius: 20px;
      padding: 16px 24px;
      width: 620px;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .goal-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .goal-stats {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--kick-green);
    }

    .progress-track {
      width: 100%;
      height: 22px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(83, 252, 24, 0.3);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f2fe 0%, var(--kick-green) 100%);
      border-radius: 12px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 15px var(--kick-green-glow);
    }

    .goal-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="goal-bar-card">
    <div class="goal-header">
      <div class="goal-title">
        <span>🎮</span> META: SORTEO PLAYSTATION 5
      </div>
      <div class="goal-stats" id="statsText">0 / 200 Asientos</div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="goal-footer">
      <span>¡Cada Sub en Kick desbloquea 1 Asiento!</span>
      <span style="color: var(--kick-green);" id="percentText">0% Completado</span>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const progressBar = document.getElementById('progressBar');
    const statsText = document.getElementById('statsText');
    const percentText = document.getElementById('percentText');

    async function loadData() {
      if (!supabaseClient) return;
      try {
        const [configRes, seatsRes] = await Promise.all([
          supabaseClient.from('giveaway_config').select('*').eq('id', 'current').single(),
          supabaseClient.from('seats').select('*')
        ]);

        const total = configRes.data?.total_seats || 200;
        const occupied = seatsRes.data?.length || 0;
        const percent = Math.min(100, Math.round((occupied / total) * 100));

        statsText.textContent = `${occupied} / ${total} Asientos`;
        percentText.textContent = `${percent}% Completado`;
        progressBar.style.width = `${percent}%`;
      } catch (e) {}
    }

    function initRealtime() {
      if (!supabaseClient) return;
      supabaseClient
        .channel('widget_bar_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'seats' }, () => loadData())
        .subscribe();
    }

    loadData();
    initRealtime();
  </script>
</body>
</html>
